# ===================================================================
# Application Core Configuration
# ===================================================================
spring.application.name=garage-system-backend
server.port=8080

# ===================================================================
# Relational Database DataSource Configuration (H2 File-based MySQL Mode)
# ===================================================================
spring.datasource.url=jdbc:h2:file:./data/garagedb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=YEAR
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===================================================================
# HikariCP Connection Pool Settings
# ===================================================================
spring.datasource.hikari.pool-name=GarageHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# ===================================================================
# H2 Interactive Web Console
# ===================================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ===================================================================
# Database Schema & Seed Data Initialization
# ===================================================================
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false

# ===================================================================
# Jackson JSON Serialization
# ===================================================================
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSZ
spring.jackson.time-zone=Asia/Bangkok
spring.jackson.serialization.write-dates-as-timestamps=false

# ===================================================================
# Logging Levels
# ===================================================================
logging.level.root=INFO
logging.level.com.garage=DEBUG
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.core.namedparam.NamedParameterJdbcTemplate=DEBUG
